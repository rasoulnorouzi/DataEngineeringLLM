# The "bouncer": lint + tests on every push and pull request.
# (Integration tests skip automatically when no database is available;
#  the scheduled pipeline.yml runs them against a real Postgres.)
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: pytest -v
