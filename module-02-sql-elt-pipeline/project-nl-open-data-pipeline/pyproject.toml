[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-open-data-pipeline"
version = "0.1.0"
description = "Scheduled ELT pipeline: Dutch open weather data -> PostgreSQL (raw/staging/marts)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]           # so ruff can tell YOUR packages from third-party ones

[tool.ruff.lint]
# Pin the rule set explicitly: ruff's defaults grow with new releases, and a rule
# added upstream should never turn your CI red without you changing a line of code.
#   E/W = pycodestyle - F = pyflakes (real bugs) - I = import sorting
#   B = bugbear (likely mistakes) - UP = modern-Python rewrites
select = ["E", "W", "F", "I", "B", "UP"]
