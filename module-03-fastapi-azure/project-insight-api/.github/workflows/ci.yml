# The bouncer: nothing merges without passing this.
#
# Two jobs on purpose:
#   unit        - fast, no services, runs everywhere
#   integration - a real Postgres, so the SQL is actually executed
#
# Without the second job the whole suite could stay green while every
# integration test silently skipped. (Module 2, Day 8 - and it still applies.)
name: CI

on:
  push:
  pull_request:
  workflow_call:        # lets cd.yml reuse this instead of duplicating it

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests (no database)
        run: pytest -v tests/test_health.py tests/test_weather.py

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: week2_db
          POSTGRES_USER: student
          POSTGRES_PASSWORD: student123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student -d week2_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://student:student123@localhost:5432/week2_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Seed the warehouse
        run: psql "postgresql://student:student123@localhost:5432/week2_db" -f sql/seed_test_data.sql
        env:
          PGPASSWORD: student123

      - name: Integration tests (real SQL, must not skip)
        run: pytest -v tests/test_db_integration.py

      - name: Fail if the integration tests skipped
        run: |
          # A skipped integration suite proves nothing. Make that impossible to miss.
          pytest tests/test_db_integration.py -q --no-header -rs | tee /tmp/out.txt
          if grep -q "skipped" /tmp/out.txt; then
            echo "::error::Integration tests skipped - the database was not reachable."
            exit 1
          fi
